name: Build APK from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "❌ ZIP файл не найден!"; exit 1; fi
          unzip -o -q "$ZIP_FILE"
          rm "$ZIP_FILE"
          if [ $(ls -1 | wc -l) -eq 1 ] && [ -d */ ]; then cd */; fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure and Build APK
        run: |
          # 1. Находим корень проекта
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$PROJECT_ROOT"

          # 2. Отключаем Jetifier (проект уже на AndroidX) и оставляем useAndroidX
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties

          # 3. Принудительно задаём стабильную версию Gradle (8.5)
          chmod +x gradlew || gradle wrapper --gradle-version 8.5
          # Если gradlew уже был, всё равно перезапишем wrapper на нужную версию
          gradle wrapper --gradle-version 8.5

          # 4. Очищаем кэш и собираем
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
