name: Build APK from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "❌ ZIP файл не найден!"; exit 1; fi
          unzip -o -q "$ZIP_FILE"
          rm "$ZIP_FILE"
          if [ $(ls -1 | wc -l) -eq 1 ] && [ -d */ ]; then cd */; fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        run: |
          # Находим папку, где лежит settings.gradle.kts
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$PROJECT_ROOT"
          
          # Делаем gradlew исполняемым (или генерируем, если его нет)
          chmod +x gradlew || gradle wrapper
          
          # Запускаем сборку
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
