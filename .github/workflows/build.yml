name: Build APK from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "❌ ZIP файл не найден!"; exit 1; fi
          unzip -o -q "$ZIP_FILE"
          rm "$ZIP_FILE"
          if [ $(ls -1 | wc -l) -eq 1 ] && [ -d */ ]; then cd */; fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure and Build APK
        run: |
          # 1. Находим корень проекта
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$PROJECT_ROOT"

          # 2. Отключаем Jetifier и настраиваем память Gradle
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          
          # Выделяем 4 ГБ памяти для кучи и 1 ГБ для Metaspace
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2g" >> gradle.properties

          # 3. Настраиваем Gradle Wrapper
          chmod +x gradlew || gradle wrapper --gradle-version 8.5
          gradle wrapper --gradle-version 8.5

          # 4. Собираем проект (без флага --no-daemon, так как демон теперь настроен правильно)
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
