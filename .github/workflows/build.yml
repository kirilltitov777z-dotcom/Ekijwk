name: Build APK from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug files
        run: |
          echo "=== Список файлов в корне ==="
          ls -la
          echo "=== Поиск всех ZIP файлов ==="
          find . -name "*.zip" -print

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP файл не найден!"
            exit 1
          fi
          echo "✅ Найден архив: $ZIP_FILE"
          unzip -q "$ZIP_FILE"
          rm "$ZIP_FILE"
          if [ $(ls -1 | wc -l) -eq 1 ] && [ -d */ ]; then cd */; fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build AAR & APK
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$PROJECT_ROOT"

          GO_DIR=$(find . -type d -path "*app/fern/vpn" | head -n 1)
          if [ -n "$GO_DIR" ]; then
            cd "$GO_DIR"
            mkdir -p "$PROJECT_ROOT/app/libs"
            gomobile bind -target=android -o "$PROJECT_ROOT/app/libs/app.aar" .
            cd "$PROJECT_ROOT"
          fi

          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
